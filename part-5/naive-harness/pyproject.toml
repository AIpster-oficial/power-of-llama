[tool.poetry]
name = "naive-harness"
version = "0.1.0"
description = "A naive OpenAI-compatible harness with SearXNG search delegation"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
openai = "^1.30.0"
httpx = "^0.27.0"
rich = "^13.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
naive-harness = "naive_harness.__main__:main"
